[project]
name = "finguard-mcp"
version = "0.1.0"
description = "Financial Consequence & Reconciliation Agent via Model Context Protocol"
authors = [{ name = "FinGuard Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.12.0",
    "pydantic>=2.5.0",
    "streamlit>=1.35.0",
    "starlette>=0.40.0,<1.0.0",
    "pytest>=8.0.0",
    "python-dateutil>=2.8.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
